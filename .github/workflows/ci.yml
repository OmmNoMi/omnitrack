name: CI Pipeline

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: 🔍 Lint & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run Ruff Linter
        run: |
          ruff check omnitrack/ --ignore E501,F401,F841

      - name: Validate DocType JSON Schemas
        run: |
          python -c "
          import json, glob, sys
          errors = 0
          for f in glob.glob('omnitrack/**/*.json', recursive=True):
              try:
                  with open(f, 'r') as fp:
                      json.load(fp)
              except Exception as e:
                  print(f'JSON Error in {f}: {e}')
                  errors += 1
          if errors > 0:
              sys.exit(1)
          print('All DocType JSON files are syntactically valid!')
          "

  frontend-build:
    name: 📦 Frontend Assets Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Verify JavaScript & CSS Bundles
        run: |
          echo "Verifying public assets and manifest structure..."
          test -f omnitrack/public/js/omnitrack.bundle.js
          test -f omnitrack/public/css/omnitrack.bundle.css
          echo "Frontend asset structure is healthy!"
