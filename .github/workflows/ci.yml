name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black flake8

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Black Format Check
        run: |
          black --check .

  test:
    name: Frappe Bench Test Suite
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:6.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout OmniTrack
        uses: actions/checkout@v4
        with:
          path: frappe-bench/apps/omnitrack

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache Pip & Yarn
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/yarn
          key: ${{ runner.os }}-frappe-ci-${{ hashFiles('**/pyproject.toml') }}

      - name: Install Frappe Bench CLI
        run: |
          pip install frappe-bench

      - name: Initialize Frappe Bench
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-15 --python $(which python) frappe-bench-env
          cd frappe-bench-env
          bench --site test-site.local make-site --root-password root --admin-password admin --db-host 127.0.0.1 --db-port 3306 --db-type mariadb
          bench get-app ../frappe-bench/apps/omnitrack
          bench --site test-site.local install-app omnitrack
          bench --site test-site.local run-tests --app omnitrack
