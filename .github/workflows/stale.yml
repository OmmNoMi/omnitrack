name: Stale Issue & PR Manager

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: 🧹 Sweep Stale Issues & PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity for 60 days. It will be closed in 14 days if no further activity occurs. Thank you for your contributions!"
          stale-pr-message: "This pull request has been automatically marked as stale because it has not had recent activity for 45 days. It will be closed in 14 days if no further activity occurs."
          stale-issue-label: "status: stale"
          stale-pr-label: "status: stale"
          exempt-issue-labels: "status: planned,status: in-progress,security,pinned"
          exempt-pr-labels: "status: in-progress,work-in-progress,pinned"
          days-before-stale: 60
          days-before-close: 14
