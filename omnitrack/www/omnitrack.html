<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ title or 'OmniTrack Workstation' }} | OmmNoMi</title>
  
  <link rel="manifest" href="/assets/omnitrack/manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OmniTrack">
  <link rel="icon" type="image/svg+xml" href="/assets/omnitrack/icons/desktop_icons/solid/omnitrack.svg">

  <!-- Google Fonts: Google Sans / Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Pre-compiled Static Tailwind CSS & Frappe UI Styles (Zero Runtime CDN) -->
  <link rel="stylesheet" href="/assets/omnitrack/dist/omnitrack.bundle.css?v={{ asset_bust }}">

  <!-- Pre-compiled Static Vue 3 Runtime, Frappe UI & Socket.io Bundle (Zero Runtime CDN) -->
  <script src="/assets/omnitrack/dist/omnitrack.bundle.js?v={{ asset_bust }}"></script>

  <style>
    [v-cloak] { display: none !important; }
    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', 'Inter', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    html.dark, html.dark body, body.dark {
      background-color: #121212 !important;
      color: #F3F4F6 !important;
    }
    html:not(.dark), html:not(.dark) body, body:not(.dark) {
      background-color: #F8F9FA !important;
      color: #111827 !important;
    }
    .pulse-record {
      animation: record-pulse 1.4s ease-in-out infinite;
    }
    @keyframes record-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.15); }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.6); }
    @media (min-width: 1024px) {
      html:has(#app.lg\:overflow-hidden),
      body:has(#app.lg\:overflow-hidden) {
        height: 100vh !important;
        max-height: 100vh !important;
        overflow: hidden !important;
      }
    }
  </style>

  <!-- Immediate script to prevent any white flash in dark mode -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('omnitrack_theme');
      const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.backgroundColor = '#121212';
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.backgroundColor = '#F8F9FA';
      }
    })();
  </script>
  <script>
    window.OMNITRACK_SESSION = {
      user: "{{ user }}",
      user_fullname: "{{ user_fullname }}",
      is_manager: {{ 'true' if is_manager else 'false' }},
      is_client: {{ 'true' if is_client else 'false' }},
      min_log_line_chars: {{ min_log_line_chars | int }},
      site: "{{ site_name }}",
      socketio_port: {{ socketio_port | int }},
      csrf_token: "{{ csrf_token }}",
      active_session: {{ (active_session | tojson) if active_session else 'null' }}
    };
  </script>
  <script>
    window.__omnitrack_mount_success__ = false;
    window.__showOmniTrackFallbackError = function(err) {
      const fb = document.getElementById('omnitrack-fallback-error');
      if (!fb) return;
      fb.style.display = 'flex';
      const appEl = document.getElementById('app');
      if (appEl) appEl.style.display = 'none';
      if (err) {
        const det = document.getElementById('omnitrack-fallback-details');
        if (det) {
          det.textContent = (err && (err.stack || err.message || String(err)));
          det.style.display = 'block';
        }
      }
    };
    setTimeout(function() {
      if (!window.__omnitrack_mount_success__) {
        const appEl = document.getElementById('app');
        if (appEl && appEl.hasAttribute('v-cloak')) {
          console.warn('[OmniTrack Watchdog]: App took too long to mount or encountered silent failure.');
          window.__showOmniTrackFallbackError(new Error('OmniTrack Mount Error: Workstation initialization timed out or halted.'));
        }
      }
    }, 4500);
  </script>
</head>

{% raw %}
<body class="min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

  <!-- Zero-White-Flash & Mount Fallback Error Boundary -->
  <div id="omnitrack-fallback-error" style="display: none;" class="min-h-screen w-full flex flex-col items-center justify-center p-6 bg-[#121212] text-white font-sans text-center z-50">
    <div class="w-12 h-12 rounded-2xl bg-red-950/60 border border-red-800 text-red-400 flex items-center justify-center mb-4 shadow-lg" aria-hidden="true"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
    <h2 class="text-lg font-bold tracking-tight">OmniTrack Workstation Initialization Error</h2>
    <p class="text-xs text-gray-400 mt-1.5 max-w-md leading-relaxed">The workstation client took too long or encountered an error while booting. Check your network connection or reload.</p>
    <div id="omnitrack-fallback-details" style="display: none;" class="mt-4 p-3 rounded-xl bg-black/60 border border-gray-800 font-mono text-[11px] text-red-400 max-w-lg text-left overflow-x-auto"></div>
    <button onclick="window.location.reload()" class="mt-5 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold transition-all shadow-md">Reload Workstation</button>
  </div>

  <!-- Pure SPA Root Mount Container -->
  <div id="app" v-cloak class="min-h-screen flex flex-col flex-1"></div>

  <script>
    (function() {
      // Auto-mount Vite production SPA
      if (window.OmniTrack && window.OmniTrack.mountApp) {
        window.OmniTrack.mountApp('#app');
        window.__omnitrack_mount_success__ = true;
      }
    })();
  </script>

</body>
{% endraw %}
</html>
