<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="b4Bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00A8CC"/>
      <stop offset="100%" stop-color="#005B7F"/>
    </linearGradient>
    <linearGradient id="b4StarLight" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>
    <linearGradient id="b4StarShadow" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B2EBF2"/>
      <stop offset="100%" stop-color="#80DEEA"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="14" fill="url(#b4Bg)"/>

  <!-- Calibrated Radar Guideline -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- 4-Point Faceted Cyber Star (North / South / East / West) -->
  <!-- Top-Right / Bottom-Left Light Facets -->
  <polygon points="32,10 32,32 37,27" fill="url(#b4StarLight)"/>
  <polygon points="32,54 32,32 27,37" fill="url(#b4StarLight)"/>
  <polygon points="54,32 32,32 37,37" fill="url(#b4StarLight)"/>
  <polygon points="10,32 32,32 27,27" fill="url(#b4StarLight)"/>

  <!-- Top-Left / Bottom-Right Shadow Facets -->
  <polygon points="32,10 32,32 27,27" fill="url(#b4StarShadow)"/>
  <polygon points="32,54 32,32 37,37" fill="url(#b4StarShadow)"/>
  <polygon points="54,32 32,32 37,27" fill="url(#b4StarShadow)"/>
  <polygon points="10,32 32,32 27,37" fill="url(#b4StarShadow)"/>

  <!-- Center Core Lens & Node -->
  <circle cx="32" cy="32" r="4" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="1.8" fill="#005B7F"/>

  <!-- Corner Guide Pips -->
  <circle cx="17" cy="17" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="47" cy="17" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="17" cy="47" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="47" cy="47" r="1.5" fill="#FFFFFF" opacity="0.6"/>
</svg>
