<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="b1Bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#00B4DB"/>
      <stop offset="100%" stop-color="#007299"/>
    </linearGradient>
    <linearGradient id="b1FacetTop" x1="32" y1="14" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>
    <linearGradient id="b1FacetLeft" x1="16" y1="32" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B2EBF2"/>
      <stop offset="100%" stop-color="#4DD0E1"/>
    </linearGradient>
    <linearGradient id="b1FacetRight" x1="48" y1="32" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#80DEEA"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="14" fill="url(#b1Bg)"/>
  
  <!-- Outer Energy Halo -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="8 25" stroke-linecap="round"/>

  <!-- Prism Facets (Isometric Diamond Core) -->
  <polygon points="32,14 46,27 32,34 18,27" fill="url(#b1FacetTop)"/>
  <polygon points="18,27 32,34 32,50 18,43" fill="url(#b1FacetLeft)"/>
  <polygon points="46,27 32,34 32,50 46,43" fill="url(#b1FacetRight)"/>
  
  <!-- Subtle Internal Light Seams -->
  <line x1="32" y1="34" x2="32" y2="50" stroke="#007299" stroke-width="1" opacity="0.4"/>
  <line x1="18" y1="27" x2="32" y2="34" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
  <line x1="46" y1="27" x2="32" y2="34" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>

  <!-- Refraction Pulse Flare -->
  <circle cx="32" cy="34" r="2" fill="#FFFFFF"/>
</svg>
