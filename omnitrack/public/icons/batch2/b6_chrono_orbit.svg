<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="b6Bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#00B4DB"/>
      <stop offset="100%" stop-color="#00799E"/>
    </linearGradient>
    <linearGradient id="b6Core" x1="22" y1="22" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDF7FA"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="14" fill="url(#b6Bg)"/>

  <!-- Subtle Dashed Orbit Guide Ring -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.8" stroke-dasharray="3 3"/>

  <!-- Segment 1: Morning Split Arc (Top-Right Quadrant) -->
  <path d="M 32 13 A 19 19 0 0 1 51 32" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"/>

  <!-- Segment 2: Evening Split Arc (Bottom-Left Quadrant) -->
  <path d="M 32 51 A 19 19 0 0 1 13 32" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"/>

  <!-- Luminous Center Pulsar -->
  <circle cx="32" cy="32" r="8.5" fill="url(#b6Core)"/>
  <circle cx="32" cy="32" r="4.2" fill="#00799E"/>
  <circle cx="32" cy="32" r="1.8" fill="#00F2FE"/>

  <!-- Cardinal Orbit Jewels -->
  <circle cx="32" cy="13" r="2.4" fill="#FFFFFF"/>
  <circle cx="51" cy="32" r="2.4" fill="#FFFFFF"/>
  <circle cx="32" cy="51" r="2.4" fill="#FFFFFF"/>
  <circle cx="13" cy="32" r="2.4" fill="#FFFFFF"/>
</svg>
