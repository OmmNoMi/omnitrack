<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="opt2Grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#00B4DB"/>
      <stop offset="100%" stop-color="#007299"/>
    </linearGradient>
    <linearGradient id="opt2DartLeft" x1="0" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFFAFE"/>
    </linearGradient>
    <linearGradient id="opt2DartRight" x1="32" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="14" fill="url(#opt2Grad)"/>
  <!-- Outer Focus Reticle -->
  <circle cx="32" cy="34" r="19" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.8" stroke-dasharray="2 3"/>
  <!-- Inner Target Ring -->
  <circle cx="32" cy="34" r="10" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.8"/>
  <!-- Bullseye Target Point -->
  <circle cx="32" cy="34" r="3.2" fill="#FFFFFF"/>
  <!-- Precision Dart / Arrow Head -->
  <path d="M 32 10 L 46 44 L 32 38 Z" fill="url(#opt2DartRight)"/>
  <path d="M 32 10 L 18 44 L 32 38 Z" fill="url(#opt2DartLeft)"/>
  <!-- Central Dart Ridge Line -->
  <line x1="32" y1="10" x2="32" y2="38" stroke="#007299" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Pulse Ring Glow -->
  <circle cx="32" cy="34" r="1.4" fill="#00E5FF"/>
</svg>
