<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="omniEyeBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#00B4DB"/>
      <stop offset="100%" stop-color="#006680"/>
    </linearGradient>
    <linearGradient id="omniEyeIris" x1="27" y1="27" x2="37" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base (Frappe CardView Standard) -->
  <rect width="64" height="64" rx="14" fill="url(#omniEyeBg)"/>

  <!-- Upper Eyelid / Shift Wave Curve -->
  <path d="M 12 36 C 22 36 24 18 34 18 C 44 18 46 28 52 28" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Lower Eyelid / Harmonic Shift Wave Curve -->
  <path d="M 12 36 C 18 36 20 46 30 46 C 40 46 42 28 52 28" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Left Horizon Anchor Node -->
  <circle cx="12" cy="36" r="3" fill="#FFFFFF"/>
  <circle cx="12" cy="36" r="1.5" fill="#006680"/>

  <!-- Right Horizon Anchor Node -->
  <circle cx="52" cy="28" r="3" fill="#FFFFFF"/>
  <circle cx="52" cy="28" r="1.5" fill="#006680"/>

  <!-- Shiva 3rd Eye Center Iris & Bindu (Omniscient Focal Point) -->
  <circle cx="32" cy="32" r="5.2" fill="url(#omniEyeIris)"/>
  <circle cx="32" cy="32" r="2.6" fill="#00B4DB"/>
  <circle cx="32" cy="1.1" r="1.1" fill="#FFFFFF"/>
</svg>
